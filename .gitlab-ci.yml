# Windows build, run manually (play button) on the self-hosted runner.
# Version comes from the build date: YY.M.D, plus -N when the day already
# has builds. Nobody types a version anywhere.

build-windows:
  stage: build
  tags:
    - windows-vm
  when: manual
  before_script:
    - git config --global --add safe.directory C:/Users/mstab/flutter
  script:
    - $date = Get-Date -Format "yy.M.d"
    - $todayCount = (git tag -l "$date*" | Measure-Object).Count
    - $ver = if ($todayCount -eq 0) { $date } else { "$date-$todayCount" }
    - $buildNum = if ($todayCount -eq 0) { 1 } else { $todayCount }
    - Write-Host "version=$ver"
    - cd app
    - C:\Users\mstab\flutter\bin\flutter.bat pub get
    - C:\Users\mstab\flutter\bin\flutter.bat build windows --release --build-name $ver --build-number $buildNum
    - cd ..
    - Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile platform-tools.zip
    - Expand-Archive platform-tools.zip -DestinationPath platform-tools
    - Copy-Item platform-tools\platform-tools\adb.exe, platform-tools\platform-tools\AdbWinApi.dll, platform-tools\platform-tools\AdbWinUsbApi.dll app\build\windows\x64\runner\Release\
    - git clone -q --depth 1 https://gitlab.com/qload/questload-changelog.git changelog-repo
    - if (Test-Path changelog-repo) { Copy-Item changelog-repo\CHANGELOG.md app\build\windows\x64\runner\Release\; Copy-Item -Recurse changelog-repo\changelogassets app\build\windows\x64\runner\Release\ } else { Write-Host "changelog repo unreachable, building without it" }
    - New-Item -ItemType Directory -Force build | Out-Null
    - Compress-Archive -Path app\build\windows\x64\runner\Release\* -DestinationPath build\questload-$ver.zip
    - Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile innosetup.exe
    - Start-Process -Wait -FilePath .\innosetup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART"
    - $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
    - if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
    - '& $iscc app\windows\QuestLoad.iss /DMyAppVersion=$ver'
    - $zipHash = (Get-FileHash build\questload-$ver.zip -Algorithm SHA256).Hash.ToLower()
    - $manifest = @{ version = $ver; sha256 = $zipHash; zip = "questload-$ver.zip" } | ConvertTo-Json
    - Set-Content build\manifest.json $manifest
    - git tag $ver; git push -q "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/qload/questload.git" $ver; if ($LASTEXITCODE -ne 0) { Write-Host "tag push failed, continuing" }
    - Write-Host "done $ver"
  artifacts:
    name: "questload-windows"
    paths:
      - build/
    expire_in: 7 days
