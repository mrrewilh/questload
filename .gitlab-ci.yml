# Windows builds run on the VM's self-hosted runner (tag: windows-vm).
# No macOS — nothing to test on.

build-windows:
  stage: build
  tags:
    - windows-vm
  before_script:
    # Runner runs as SYSTEM; flutter's internal git rejects the user-owned
    # flutter checkout without this.
    - git config --global --add safe.directory C:/Users/mstab/flutter
  script:
    - cd app
    - C:\Users\mstab\flutter\bin\flutter.bat pub get
    - C:\Users\mstab\flutter\bin\flutter.bat build windows --release
  artifacts:
    name: "questload-windows"
    paths:
      - app/build/windows/x64/runner/Release/
    expire_in: 7 days
