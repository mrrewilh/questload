name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dart-lang/setup-dart@v1

      - name: Compute version yy.M.d + -N
        id: ver
        shell: pwsh
        run: |
          $date = Get-Date -Format "yy.M.d"
          $today = (Get-Date).ToString("yyyy-MM-dd")
          # Count successful runs of this workflow today via GitHub API
          $hdr = @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}"; Accept = "application/vnd.github+json" }
          try {
            $runs = Invoke-RestMethod -Headers $hdr -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/runs?per_page=100"
            $todayCount = ($runs.workflow_runs | Where-Object { $_.conclusion -eq "success" -and $_.created_at.StartsWith($today) } | Measure-Object).Count
          } catch { $todayCount = 0 }
          $ver = if ($todayCount -eq 0) { $date } else { "$date-$todayCount" }
          $buildNum = if ($todayCount -eq 0) { 1 } else { $todayCount + 1 }
          echo "ver=$ver" >> $env:GITHUB_OUTPUT
          echo "buildNum=$buildNum" >> $env:GITHUB_OUTPUT
          Write-Host "version=$ver buildNum=$buildNum"

      - name: Flutter analyze & build
        shell: pwsh
        run: |
          cd app
          flutter pub get
          flutter analyze
          dart format --output=none --set-exit-if-changed lib
          flutter build windows --release --build-name ${{ steps.ver.outputs.ver }} --build-number ${{ steps.ver.outputs.buildNum }}
          cd ..

      - name: Bundle platform-tools (adb)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath platform-tools
          Copy-Item platform-tools\platform-tools\adb.exe, platform-tools\platform-tools\AdbWinApi.dll, platform-tools\platform-tools\AdbWinUsbApi.dll app\build\windows\x64\runner\Release\

      - name: Build launcher exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          dart pub get --directory=launcher
          dart compile exe launcher/bin/launcher.dart -o build/questload.exe
          if (!(Test-Path build/questload.exe)) { throw "launcher build failed" }

      - name: Assemble qlapp layout + zip
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.ver }}"
          New-Item -ItemType Directory -Force build/qlapp | Out-Null
          Copy-Item app\build\windows\x64\runner\Release\* build/qlapp\ -Recurse -Force
          if (Test-Path repo/CHANGELOG.md) { Copy-Item repo/CHANGELOG.md build/qlapp/CHANGELOG.md -Force }
          # Zip contains qlapp/ + root launcher next to it. User extracts zip where they want install root.
          Compress-Archive -Path build/qlapp,build/questload.exe -DestinationPath build/questload-$ver.zip -Force
          $zipHash = (Get-FileHash build/questload-$ver.zip -Algorithm SHA256).Hash.ToLower()
          $manifest = @{ version = $ver; sha256 = $zipHash; zip = "questload-$ver.zip"; zip_url = "https://github.com/${{ github.repository }}/releases/download/v$ver/questload-$ver.zip" } | ConvertTo-Json
          Set-Content build/manifest.json $manifest
          Write-Host $manifest
          # Prepare installer exe with versioned name
          Copy-Item build/questload.exe build/QuestLoad-Installer-$ver.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          name: v${{ steps.ver.outputs.ver }}
          body_path: repo/CHANGELOG.md
          files: |
            build/questload-${{ steps.ver.outputs.ver }}.zip
            build/QuestLoad-Installer-${{ steps.ver.outputs.ver }}.exe
            build/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
